type Query {
  """Invoice list"""
  invoices(
    """Filtering options for the list"""
    filter: InvoiceFilterInput
  ): InvoiceListType

  """Customer list"""
  customers(
    """Filtering options for the list"""
    filter: CustomerFilterInput
  ): CustomerListType

  """Product list"""
  products(
    """Filtering options for the list"""
    filter: ProductFilterInput
  ): ProductListType

  """Payment list"""
  payments(
    """Filtering options for the list"""
    filter: PaymentFilterInput
  ): PaymentListType

  """ReconciliationRun list"""
  reconciliationRuns(
    """Filtering options for the list"""
    filter: ReconciliationRunFilterInput
  ): ReconciliationRunListType

  """MatchProposal list"""
  matchProposals(
    """Filtering options for the list"""
    filter: MatchProposalFilterInput
  ): MatchProposalListType
}

type InvoiceListType {
  results(
    """Number of results to return per page."""
    first: Int

    """Opaque cursor; returns the results that come after it in the ordering."""
    cursor: String
  ): [InvoiceType]
  totalCount: Int

  """Forward keyset pagination metadata."""
  pageInfo(
    """Number of results to return per page."""
    first: Int

    """Opaque cursor; returns the results that come after it in the ordering."""
    cursor: String
  ): CursorPageInfo
}

type InvoiceType {
