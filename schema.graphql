type Mutation {
  """The customer that was saved, or the reasons it was not."""
  saveCustomer(input: CustomerInput!): SaveCustomerPayload

  """The draft invoice that was saved, or the reasons it was not."""
  saveDraft(input: DraftInvoiceInput!): SaveDraftPayload

  """The id of the draft that was deleted, or the reasons it was not."""
  deleteDraft(id: ID!): DeleteDraftPayload

  """The invoice that was issued, or the reasons it was not."""
  issueInvoice(id: ID!): IssueInvoicePayload

  """The invoice whose email was requested, or the reasons it was not."""
  sendInvoice(input: SendInvoiceInput!): SendInvoicePayload

  """The credit note that was drafted, or the reasons it was not."""
  draftCreditNote(input: CreditNoteInput!): DraftCreditNotePayload

  """The proposal after it was accepted, or the reasons it was not."""
  acceptMatch(id: ID!): AcceptMatchPayload

  """The proposal after it was rejected, or the reasons it was not."""
  rejectMatch(id: ID!): RejectMatchPayload
}

type SaveCustomerPayload {
  errors: [DomainError!]!
  customer: CustomerType
}

"""A typed failure reported in a mutation payload."""
type DomainError {
  code: ErrorCode!
  message: String!

  """Path of the input value at fault, when there is one."""
  field: String
}

"""Kind of mutation failure."""
enum ErrorCode {
  VALIDATION_ERROR
  INVALID_TRANSITION
  PERMISSION_DENIED
  NOT_FOUND
}

"""
The fields of a customer; with an id they replace those of the customer.
"""
input CustomerInput {
  id: ID = null
  name: String!
  taxId: String = ""
  emails: [String!] = []
  addressLine1: String = ""
  addressLine2: String = ""
  city: String = ""
  state: String = ""
  postalCode: String = ""
  country: String = "US"
}

type SaveDraftPayload {
  errors: [DomainError!]!
  invoice: InvoiceType
}

"A draft invoice and its lines; with an id they replace those of the draft.\n\nOmitting the currency keeps the current one, or uses the default of the tenant for a new\ndraft.\n"
input DraftInvoiceInput {
  id: ID = null
  customerId: ID!
  currency: String = null
  dueDate: CustomDate = null
  notes: String = ""
  lines: [DraftLineInput!]!
}

"""
One line of a draft; money is in integer cents and the quantity has up to 3 decimals.
"""
input DraftLineInput {
  description: String!
  quantity: Decimal!
  unitPrice: BigInt!
  discountBp: Int = 0
  productId: ID = null
  taxRateIds: [ID!] = []
}

type DeleteDraftPayload {
  errors: [DomainError!]!
  id: ID
}

type IssueInvoicePayload {
  errors: [DomainError!]!
  invoice: InvoiceType
}

type SendInvoicePayload {
  errors: [DomainError!]!
  invoice: InvoiceType
}

"A request to email an issued invoice; repeating the key never sends a second email.\n\nWithout recipients the email goes to the addresses frozen on the invoice.\n"
input SendInvoiceInput {
  id: ID!
  idempotencyKey: String!
  recipients: [String!] = null
}

type DraftCreditNotePayload {
  errors: [DomainError!]!
  creditNote: InvoiceType
}

"""
A credit note for an issued invoice; without lines it credits the whole invoice.
"""
input CreditNoteInput {
  invoiceId: ID!
  lines: [DraftLineInput!] = null
}

type AcceptMatchPayload {
  errors: [DomainError!]!
  proposal: MatchProposalType
}

type RejectMatchPayload {
  errors: [DomainError!]!
  proposal: MatchProposalType
}
