name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: ci-superuser-pw
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7.4-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SECRET_KEY: ci-only-not-a-secret
      DATABASE_URL: postgres://invoicehub_migrator:migrator-dev-pw@localhost:5432/invoicehub
      DATABASE_APP_ROLE: invoicehub_app
      CELERY_BROKER_URL: redis://localhost:6379/0
      CACHE_URL: redis://localhost:6379/1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          version: "0.13.9"
      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0 fonts-dejavu-core
      - run: uv sync --frozen
      - name: Create database roles
        env:
          PGHOST: localhost
          PGPORT: "5432"
          PGUSER: postgres
          PGPASSWORD: ci-superuser-pw
        run: sh docker/postgres/init-roles.sh
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy .
      - run: uv run python manage.py makemigrations --check
      - run: uv run pytest --cov
      - name: Tenant isolation suite
        run: uv run pytest -m isolation
      - name: Schema contract against the base
        env:
          BASE_REF: ${{ github.event_name == 'pull_request' && github.base_ref || '' }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          # A force push to main whose before sha is gone makes the fetch fail; that fails
          # closed on purpose.
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --no-tags --depth=1 origin "$BEFORE_SHA"
          else
            echo "::notice::No base revision to compare with; skipping the schema contract check."
            exit 0
          fi
          if ! git cat-file -e FETCH_HEAD:schema.graphql 2>/dev/null; then
            echo "::notice::The base has no schema.graphql yet; skipping the schema contract check."
            exit 0
          fi
          git show FETCH_HEAD:schema.graphql > "$RUNNER_TEMP/base.graphql"
          uv run python manage.py check_schema_contract --base "$RUNNER_TEMP/base.graphql"

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -t invoicehub:ci .

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: make demo
      - name: Rerunning reports the finished demo without seeding again
        run: make demo
      # The shop example runs on the runner against the published port, with a token that
      # issue_api_token mints inside the web container for the demo user.
      - name: The shop example invoices two orders through GraphQL
        run: |
          token=$(docker compose exec -T web python manage.py issue_api_token \
            --user demo@example.com --tenant "Demo Company" \
            --scope invoices:read --scope invoices:write --name shop-ci)
          echo "::add-mask::$token"
          export INVOICEHUB_API_TOKEN="$token"
          first=$(python3 examples/shop_integration/shop.py)
          second=$(python3 examples/shop_integration/shop.py)
          echo "$first"
          echo "$second"
          pattern='^Issued invoice INV-[0-9]{4}-[0-9]{5} for .*, total [0-9]+\.[0-9]{2} [A-Z]{3}$'
          echo "$first" | grep -Eq "$pattern"
          echo "$second" | grep -Eq "$pattern"
          [ "$first" != "$second" ] || { echo "the rerun issued no new invoice"; exit 1; }
          count=$(curl -fsS "${INVOICEHUB_GRAPHQL_URL:-http://localhost:8010/graphql/}" \
            -H "Authorization: Bearer $token" -H "Content-Type: application/json" \
            -d '{"query":"{ customers(filter: {taxId: {exact: \"12-3456789\"}}) { totalCount } }"}' \
            | python3 -c 'import json, sys; print(json.load(sys.stdin)["data"]["customers"]["totalCount"])')
          [ "$count" = 1 ] || { echo "expected one shop customer, found $count"; exit 1; }
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color
