[project]
name = "invoicehub"
version = "0.1.0"
description = "Multi-tenant invoicing SaaS"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "celery[redis]>=5.7.0",
    "django>=6.1,<6.2",
    "django-allauth>=65.22.1",
    "django-environ>=0.14.0",
    "django-unfold>=0.110.1",
    "faker>=40.63.0",
    "gunicorn>=27.0.1",
    "psycopg[binary]>=3.3.9",
    "redis>=8.2.0",
    "weasyprint>=70.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "django-stubs[compatible-mypy]>=6.1.2",
    "hypothesis>=6.170.17",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.6",
]

[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = ["migrations"]
force-exclude = true

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "D", "DOC201", "DOC202", "DOC402", "DOC403", "DOC501", "DOC502"]
preview = true
explicit-preview-rules = true

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"**/migrations/*" = ["D", "DOC"]

[tool.mypy]
strict = true
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
django_settings_module = "config.settings"

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "allauth", "allauth.*", "weasyprint", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
addopts = "--strict-markers"
markers = ["isolation: tenant isolation suite"]

[tool.coverage.run]
source = ["."]
omit = ["*/migrations/*", "tests/*", "manage.py", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
fail_under = 85
